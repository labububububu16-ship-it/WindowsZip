    <path d="M0 -66L12 -12L66 0L12 12L0 66L-12 12L-66 0L-12 -12Z" fill="#BDF8FF"/>
    <path d="M0 -40L7 -7L40 0L7 7L0 40L-7 7L-40 0L-7 -7Z" fill="#FFFFFF"/>
