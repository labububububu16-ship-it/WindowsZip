    <path d="M518 407V690" stroke="url(#zipper)" stroke-width="18" stroke-linecap="round"/>
    <g fill="#9CB1CA" stroke="#F7FBFF" stroke-width="4">
      <rect x="500" y="434" width="36" height="23" rx="7"/>
      <rect x="500" y="475" width="36" height="23" rx="7"/>
      <rect x="500" y="516" width="36" height="23" rx="7"/>
      <rect x="500" y="557" width="36" height="23" rx="7"/>
      <rect x="500" y="598" width="36" height="23" rx="7"/>
      <rect x="500" y="639" width="36" height="23" rx="7"/>
    </g>
    <path d="M494 398H542C555 398 565 409 563 422L558 455H478L473 422C471 409 481 398 494 398Z" fill="url(#zipper)" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="518" cy="422" r="8" fill="#567698"/>
